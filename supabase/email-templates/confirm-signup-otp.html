<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;background:#f4f4ef;font-family:Arial,Helvetica,sans-serif;color:#111">
  <main style="max-width:580px;margin:40px auto;padding:48px 35px;border:1px solid #deded7;background:#fff">
    <p style="font-size:12px;letter-spacing:.3em">FORMA · ACCÈS CLIENT</p>
    <h1 style="font-size:32px;line-height:1.15;font-weight:500">Vérifiez votre adresse e-mail.</h1>
    <p style="line-height:1.7">Saisissez ce code à six chiffres sur l'écran de confirmation Forma :</p>
    <div style="padding:28px 15px;text-align:center;background:#f4f4ef;font-size:36px;letter-spacing:12px;font-weight:bold">{{ .Token }}</div>
    <p style="font-size:13px;line-height:1.7;margin-top:30px">Ce code est personnel et temporaire. Si vous n'avez pas créé de compte Forma, ignorez cet e-mail. Ne partagez jamais ce code.</p>
  </main>
</body></html>
