name: FORMA Quality Gate
on:
  push:
    branches:
      - forma/finitions-responsive-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile production bundle
        run: npm run build
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser test suite
        run: npm test
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forma-browser-captures
          path: test-results/
          if-no-files-found: ignore
